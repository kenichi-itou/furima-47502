default: &default
  adapter: mysql2
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password:
  socket: /tmp/mysql.sock

development:
  <<: *default
  database: furima_47502_development

test:
  <<: *default
  database: furima_47502_test
  prepared_statements: false

production:
  <<: *default
  database: furima_47502_production
  username: furima_47502
  password: <%= ENV["FURIMA_47502_DATABASE_PASSWORD"] %>